name: assistant

on:
  workflow_dispatch:
  push:
    paths:
      - "assistant/**"
      - ".github/workflows/assistant.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: assistant/go.sum

      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o dist/assistant .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: assistant-linux-amd64
          path: assistant/dist/assistant
          if-no-files-found: error
